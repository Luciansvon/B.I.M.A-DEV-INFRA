name: Infrastructure CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Repository audit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.15'
      - name: Regression tests
        shell: bash
        run: |
          mkdir -p .artifacts
          set -o pipefail
          python -I -m unittest discover -s tests -v 2>&1 | tee .artifacts/tests.log
      - name: Audit repository
        if: ${{ !cancelled() }}
        run: python -I automation/repository_audit.py --root . --policy .bima/audit.json --output .artifacts/audit
      - name: Preserve evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: infra-ci-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/tests.log
            .artifacts/audit/result.json
            .artifacts/audit/report.md
          if-no-files-found: error
          retention-days: 14
