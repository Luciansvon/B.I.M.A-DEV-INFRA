name: Infrastructure CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install verified actionlint
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  '"$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Install pinned Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.53.1
          checksum: a54a408f6861ff921f6e87774180db31bacd8c1e7c944ca696db9fea49a82fc7
      - name: Install verified prek
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/prek.tar.gz" \
            https://github.com/j178/prek/releases/download/v0.5.2/prek-x86_64-unknown-linux-gnu.tar.gz
          echo 'a4d51a463cb15ee2929368cc4884eec4ef33dce3ff5101b40e8ad7e1205b8f40  '"$RUNNER_TEMP/prek.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/prek.tar.gz" -C "$RUNNER_TEMP" --strip-components=1 \
            prek-x86_64-unknown-linux-gnu/prek
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Install verified action-validator
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/action-validator" \
            https://github.com/mpalmer/action-validator/releases/download/v0.9.0/action-validator_linux_amd64
          echo '9f42f94fca5b8d04c13bccfbb331104b37a9250650d89ae58dc888d46206f9b9  '"$RUNNER_TEMP/action-validator" | sha256sum --check
          chmod +x "$RUNNER_TEMP/action-validator"
      - name: Install verified pinact
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/pinact.tar.gz" \
            https://github.com/suzuki-shunsuke/pinact/releases/download/v4.1.1/pinact_linux_amd64.tar.gz
          echo 'd1cffebe5704b74e2e5f8a864efb9f7e54768972dc686188c008033fb1797841  '"$RUNNER_TEMP/pinact.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/pinact.tar.gz" -C "$RUNNER_TEMP" pinact
      - name: Install verified zizmor
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/zizmor.tar.gz" \
            https://github.com/zizmorcore/zizmor/releases/download/v1.30.0/zizmor-x86_64-unknown-linux-gnu.tar.gz
          echo 'ec8c95cd800845abb9bbc5f377ec7c57d2eb8e2386a00a201d3a74ee4092e5ed  '"$RUNNER_TEMP/zizmor.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/zizmor.tar.gz" -C "$RUNNER_TEMP" zizmor
      - name: Validate pre-flight hooks
        shell: bash
        run: |
          mkdir -p .artifacts
          set -o pipefail
          task preflight 2>&1 | tee .artifacts/prek.log
          printf 'status=pass\nconfig=prek.toml\n' | tee -a .artifacts/prek.log
      - name: Validate workflows
        shell: bash
        run: |
          mkdir -p .artifacts
          set -o pipefail
          task workflow-lint 2>&1 | tee .artifacts/actionlint.log
          printf 'status=pass\nfiles=%s\n' "$(find .github/workflows -maxdepth 1 -type f -name '*.yml' | wc -l)" | tee -a .artifacts/actionlint.log
      - name: Preserve workflow lint evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workflow-lint-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/actionlint.log
            .artifacts/prek.log
          if-no-files-found: error
          retention-days: 14

  audit:
    name: Repository audit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.15'
      - name: Install pinned Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.53.1
          checksum: ${{ runner.os == 'Linux' && 'a54a408f6861ff921f6e87774180db31bacd8c1e7c944ca696db9fea49a82fc7' || '27c0cd248c12cba03d8958d954a3df981c900be885ec9ce5f6a3cdc4e9a19316' }}
      - name: Regression tests
        shell: bash
        run: |
          mkdir -p .artifacts
          set -o pipefail
          task test 2>&1 | tee .artifacts/tests.log
      - name: Verify result normalization action
        id: normalize-result
        uses: $/.github/actions/normalize-rust-libtest
        with:
          config-path: tests/fixtures/result-normalizer/config-pass.json
          native-output-path: tests/fixtures/result-normalizer/rust-pass.log
          subject-revision: ${{ github.sha }}
          subject-dirty: 'false'
          attempt-id: ci-${{ github.run_id }}-${{ matrix.os }}
          attempt-sequence: '1'
          exit-code: '0'
          output-directory: .artifacts/result-normalization
      - name: Verify result normalization outputs
        shell: bash
        env:
          NORMALIZED_VERDICT: ${{ steps.normalize-result.outputs.verdict }}
          NORMALIZED_REASON: ${{ steps.normalize-result.outputs.reason-code }}
          NORMALIZED_SHA256: ${{ steps.normalize-result.outputs.result-sha256 }}
        run: |
          [[ "$NORMALIZED_VERDICT" == "PASS" ]]
          [[ "$NORMALIZED_REASON" == "ALL_EXPECTED_TESTS_PASSED" ]]
          [[ "$NORMALIZED_SHA256" =~ ^[0-9a-f]{64}$ ]]
      - name: Audit repository
        if: ${{ !cancelled() }}
        run: task audit
      - name: Canonicalize audit evidence
        if: ${{ !cancelled() }}
        run: task evidence
      - name: Build bounded failure packet
        if: ${{ !cancelled() }}
        run: task agent-packet
      - name: Preserve evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: infra-ci-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/tests.log
            .artifacts/result-normalization/result.json
            .artifacts/audit/result.json
            .artifacts/audit/report.md
            .artifacts/evidence/canonical.json
            .artifacts/evidence/execution.json
            .artifacts/evidence/canonical.sha256
            .artifacts/agent/packet.json
            .artifacts/agent/packet.sha256
          if-no-files-found: error
          retention-days: 14
