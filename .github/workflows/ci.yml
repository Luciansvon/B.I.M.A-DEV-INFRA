name: Infrastructure CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install verified actionlint
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  '"$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Install pinned Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.53.1
          checksum: a54a408f6861ff921f6e87774180db31bacd8c1e7c944ca696db9fea49a82fc7
      - name: Install verified prek
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/prek.tar.gz" \
            https://github.com/j178/prek/releases/download/v0.5.7/prek-x86_64-unknown-linux-gnu.tar.gz
          echo 'e238e5a6b4e384e8d18f33d3c3b1a329be0e1237f77ac6e021e641ddd3a2bab6  '"$RUNNER_TEMP/prek.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/prek.tar.gz" -C "$RUNNER_TEMP" --strip-components=1 \
            prek-x86_64-unknown-linux-gnu/prek
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Install verified security tools
        shell: bash
        run: |
          bash automation/install_security_tools.sh "$RUNNER_TEMP/bima-security-tools"
          echo "$RUNNER_TEMP/bima-security-tools" >> "$GITHUB_PATH"
      - name: Validate pre-flight hooks
        shell: bash
        run: |
          mkdir -p .artifacts
          set -o pipefail
          task preflight 2>&1 | tee .artifacts/prek.log
          printf 'status=pass\nconfig=prek.toml\n' | tee -a .artifacts/prek.log
      - name: Validate workflows
        shell: bash
        run: |
          mkdir -p .artifacts
          set -o pipefail
          task workflow-lint 2>&1 | tee .artifacts/actionlint.log
          printf 'status=pass\nfiles=%s\n' "$(find .github/workflows -maxdepth 1 -type f -name '*.yml' | wc -l)" | tee -a .artifacts/actionlint.log
      - name: Preserve workflow lint evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workflow-lint-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/actionlint.log
            .artifacts/prek.log
          if-no-files-found: error
          retention-days: 14

  audit:
    name: Repository audit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.15'
      - name: Install pinned Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.53.1
          checksum: ${{ runner.os == 'Linux' && 'a54a408f6861ff921f6e87774180db31bacd8c1e7c944ca696db9fea49a82fc7' || '27c0cd248c12cba03d8958d954a3df981c900be885ec9ce5f6a3cdc4e9a19316' }}
      - name: Regression tests
        shell: bash
        run: |
          mkdir -p .artifacts
          set -o pipefail
          task test 2>&1 | tee .artifacts/tests.log
      - name: Verify result normalization action
        id: normalize-result
        uses: ./.github/actions/normalize-rust-libtest # zizmor: ignore[self-repository] actionlint 1.7.12 does not support $/ references
        with:
          config-path: tests/fixtures/result-normalizer/config-pass.json
          native-output-path: tests/fixtures/result-normalizer/rust-pass.log
          subject-revision: ${{ github.sha }}
          subject-dirty: 'false'
          attempt-id: ci-${{ github.run_id }}-${{ matrix.os }}
          attempt-sequence: '1'
          exit-code: '0'
          output-directory: .artifacts/result-normalization
      - name: Verify result normalization outputs
        shell: bash
        env:
          NORMALIZED_VERDICT: ${{ steps.normalize-result.outputs.verdict }}
          NORMALIZED_REASON: ${{ steps.normalize-result.outputs.reason-code }}
          NORMALIZED_SHA256: ${{ steps.normalize-result.outputs.result-sha256 }}
        run: |
          [[ "$NORMALIZED_VERDICT" == "PASS" ]]
          [[ "$NORMALIZED_REASON" == "ALL_EXPECTED_TESTS_PASSED" ]]
          [[ "$NORMALIZED_SHA256" =~ ^[0-9a-f]{64}$ ]]
      - name: Aggregate required verification results
        shell: bash
        env:
          SUBJECT_REVISION: ${{ github.sha }}
        run: |
          python -I - <<'PY'
          import json
          import os
          from pathlib import Path

          plan = json.loads(
              Path('tests/fixtures/verification-aggregate/plan-pass.json').read_text(
                  encoding='utf-8'))
          plan['subject']['revision'] = os.environ['SUBJECT_REVISION']
          destination = Path('.artifacts/verification-plan/plan.json')
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text(
              json.dumps(plan, ensure_ascii=True, sort_keys=True,
                         separators=(',', ':')) + '\n',
              encoding='utf-8', newline='\n')
          PY
          python -I automation/verification_aggregate.py \
            --plan .artifacts/verification-plan/plan.json \
            --result .artifacts/result-normalization/result.json \
            --output .artifacts/verification-aggregate
          python -I - <<'PY'
          import json
          from pathlib import Path

          aggregate = json.loads(
              Path('.artifacts/verification-aggregate/aggregate.json').read_text(
                  encoding='utf-8'))
          assert aggregate['verdict'] == 'PASS'
          assert aggregate['reason_code'] == 'ALL_REQUIRED_CHECKS_PASSED'
          assert aggregate['counts']['required']['declared'] == 1
          assert aggregate['counts']['required']['pass'] == 1
          assert aggregate['unresolved_required'] == []
          PY
      - name: Create and verify artifact identity manifest
        shell: bash
        env:
          SUBJECT_REVISION: ${{ github.sha }}
        run: |
          python -I - <<'PY'
          import json
          import os
          from pathlib import Path

          artifact = Path('.artifacts/artifact-fixture/application.bin')
          artifact.parent.mkdir(parents=True, exist_ok=True)
          artifact.write_bytes(b'BIMA artifact identity fixture v1\x00')

          request = json.loads(
              Path('tests/fixtures/artifact-identity/request.json').read_text(
                  encoding='utf-8'))
          request['subject']['revision'] = os.environ['SUBJECT_REVISION']
          destination = Path('.artifacts/artifact-request/request.json')
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text(
              json.dumps(request, ensure_ascii=True, sort_keys=True,
                         separators=(',', ':')) + '\n',
              encoding='utf-8', newline='\n')
          PY
          python -I automation/artifact_identity.py create \
            --request .artifacts/artifact-request/request.json \
            --root . \
            --output .artifacts/artifact-identity
          python -I automation/artifact_identity.py verify \
            --manifest .artifacts/artifact-identity/manifest.json \
            --root . \
            --output .artifacts/artifact-identity
          python -I - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          manifest_path = Path('.artifacts/artifact-identity/manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          verification = json.loads(
              Path('.artifacts/artifact-identity/verification.json').read_text(
                  encoding='utf-8'))
          assert len(manifest['artifacts']) == 1
          assert manifest['artifacts'][0]['path'] == \
              '.artifacts/artifact-fixture/application.bin'
          assert verification['verdict'] == 'PASS'
          assert verification['reason_code'] == 'ALL_ARTIFACTS_MATCH'
          assert verification['counts'] == {
              'changed': 0, 'declared': 1, 'matched': 1,
              'missing': 0, 'unsafe': 0}
          assert verification['manifest_sha256'] == hashlib.sha256(
              manifest_path.read_bytes()).hexdigest()
          assert verification['unresolved_artifacts'] == []
          PY
      - name: Verify P3-P5 gated core contracts
        shell: bash
        run: |
          python -I automation/failure_records.py \
            --input failure-records/records.json \
            --output .artifacts/failure-records

          set +e
          python -I automation/failure_memory.py \
            --input failure-records/records.json \
            --database "$RUNNER_TEMP/bima-failure-memory-production.sqlite3" \
            --repository-root . \
            --report .artifacts/failure-memory/report.json
          memory_status=$?
          set -e
          [[ "$memory_status" == "3" ]]
          [[ ! -e "$RUNNER_TEMP/bima-failure-memory-production.sqlite3" ]]

          set +e
          python -I automation/failure_memory_benchmark.py \
            --records failure-records/records.json \
            --queries benchmarks/failure-memory/held-out.json \
            --database "$RUNNER_TEMP/bima-failure-memory-benchmark.sqlite3" \
            --repository-root . \
            --report .artifacts/failure-memory-benchmark/report.json \
            --bind-record-set
          benchmark_status=$?
          set -e
          [[ "$benchmark_status" == "3" ]]
          [[ ! -e "$RUNNER_TEMP/bima-failure-memory-benchmark.sqlite3" ]]

          set +e
          python -I automation/experiment_gate.py \
            --request tests/fixtures/experiment-gate/request-one-project.json \
            --output .artifacts/experiment-gate
          experiment_status=$?
          set -e
          [[ "$experiment_status" == "3" ]]

          python -I - <<'PY'
          import json
          from pathlib import Path

          failure_summary = json.loads(
              Path('.artifacts/failure-records/summary.json').read_text(encoding='utf-8'))
          memory = json.loads(
              Path('.artifacts/failure-memory/report.json').read_text(encoding='utf-8'))
          benchmark = json.loads(
              Path('.artifacts/failure-memory-benchmark/report.json').read_text(encoding='utf-8'))
          experiment = json.loads(
              Path('.artifacts/experiment-gate/decision.json').read_text(encoding='utf-8'))
          assert failure_summary['real_verified_records'] >= 6
          assert (failure_summary['real_verified_records']
                  < memory['minimum_real_cases'])
          assert memory['status'] == 'BLOCKED'
          assert memory['reason_code'] == 'INSUFFICIENT_REAL_CASES'
          assert memory['database_created'] is False
          assert benchmark['status'] == 'BLOCKED'
          assert benchmark['reason_code'] == 'INSUFFICIENT_REAL_CASES'
          assert benchmark['record_set_sha256'] == failure_summary['record_set_sha256']
          assert benchmark['real_verified_records'] == failure_summary['real_verified_records']
          assert benchmark['metrics'] is None
          assert benchmark['database_created'] is False
          assert experiment['status'] == 'BLOCKED'
          assert experiment['reason_code'] == 'INSUFFICIENT_CROSS_PROJECT_DEMAND'
          assert experiment['execution_started'] is False
          PY
      - name: Validate workflow catalog
        shell: bash
        run: python -I automation/workflow_catalog.py
      - name: Plan fleet dispatch
        shell: bash
        run: |
          python -I automation/fleet_dispatch.py --output .artifacts/fleet
          python -I - <<'PY'
          import json
          from pathlib import Path

          evidence = json.loads(
              Path('.artifacts/fleet/evidence.json').read_text(encoding='utf-8'))
          assert evidence['mode'] == 'dry-run'
          assert evidence['ref'] == 'main'
          assert evidence['dispatches']
          assert all(item['status'] == 'planned' for item in evidence['dispatches'])
          assert all(item['run_id'] is None for item in evidence['dispatches'])
          PY
      - name: Audit repository
        if: ${{ !cancelled() }}
        run: task audit
      - name: Canonicalize audit evidence
        if: ${{ !cancelled() }}
        run: task evidence
      - name: Build bounded failure packet
        if: ${{ !cancelled() }}
        run: task agent-packet
      - name: Preserve evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: infra-ci-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/tests.log
            .artifacts/result-normalization/result.json
            .artifacts/verification-plan/plan.json
            .artifacts/verification-aggregate/aggregate.json
            .artifacts/artifact-fixture/application.bin
            .artifacts/artifact-request/request.json
            .artifacts/artifact-identity/manifest.json
            .artifacts/artifact-identity/verification.json
            .artifacts/failure-records/records.json
            .artifacts/failure-records/summary.json
            .artifacts/failure-memory/report.json
            .artifacts/failure-memory-benchmark/report.json
            .artifacts/experiment-gate/decision.json
            .artifacts/fleet/evidence.json
            .artifacts/audit/result.json
            .artifacts/audit/report.md
            .artifacts/evidence/canonical.json
            .artifacts/evidence/execution.json
            .artifacts/evidence/canonical.sha256
            .artifacts/agent/packet.json
            .artifacts/agent/packet.sha256
          if-no-files-found: error
          retention-days: 14

  security-supply-chain:
    name: Security and supply chain
    permissions:
      contents: read
    uses: ./.github/workflows/security-supply-chain.yml # zizmor: ignore[self-repository] actionlint 1.7.12 does not support $/ references
    with:
      artifact-name: security-supply-chain-self-test
      # This repository has no dependency manifests, so dependency review has nothing to compare.
      dependency-review: false
