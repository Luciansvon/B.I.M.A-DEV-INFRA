name: Reusable repository audit

on:
  workflow_call:
    inputs:
      infra-ref:
        description: Full DEV-INFRA commit SHA; match the SHA used to call this workflow
        required: true
        type: string
      policy-path:
        description: Repository-relative JSON policy; empty uses built-in defaults
        required: false
        type: string
        default: ''
      artifact-name:
        description: Unique artifact prefix for each call in a workflow or matrix
        required: false
        type: string
        default: repository-audit
    outputs:
      artifact-id:
        description: Uploaded audit evidence artifact ID
        value: ${{ jobs.audit.outputs.artifact-id }}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      artifact-id: ${{ steps.evidence.outputs.artifact-id }}
    steps:
      - name: Validate infrastructure revision
        shell: bash
        env:
          INFRA_REF: ${{ inputs.infra-ref }}
        run: |
          if [[ ! "$INFRA_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'infra-ref must be a full lowercase commit SHA' >&2
            exit 2
          fi
      - name: Checkout caller as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: subject
          persist-credentials: false
      - name: Checkout pinned infrastructure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Luciansvon/B.I.M.A-DEV-INFRA
          ref: ${{ inputs.infra-ref }}
          path: infra
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.15'
      - name: Audit caller
        shell: bash
        env:
          POLICY_PATH: ${{ inputs.policy-path }}
        run: |
          args=()
          if [[ -n "$POLICY_PATH" ]]; then
            args+=(--policy "$POLICY_PATH")
          fi
          python -I infra/automation/repository_audit.py --root subject \
            --output "$RUNNER_TEMP/bima-audit" "${args[@]}"
      - name: Canonicalize audit evidence
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python -I infra/automation/canonical_evidence.py \
            --input "$RUNNER_TEMP/bima-audit/result.json" \
            --output "$RUNNER_TEMP/bima-evidence"
      - name: Preserve evidence even when audit fails
        id: evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/bima-audit/result.json
            ${{ runner.temp }}/bima-audit/report.md
            ${{ runner.temp }}/bima-evidence/canonical.json
            ${{ runner.temp }}/bima-evidence/execution.json
            ${{ runner.temp }}/bima-evidence/canonical.sha256
          if-no-files-found: error
          retention-days: 14
