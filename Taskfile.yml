version: '3'

output: prefixed

vars:
  PYTHON: '{{default "python" .PYTHON}}'
  ACTIONLINT: '{{default "actionlint" .ACTIONLINT}}'
  PREK: '{{default "prek" .PREK}}'
  EVIDENCE_DIR: '{{default ".artifacts" .EVIDENCE_DIR}}'

tasks:
  default:
    desc: List the available deterministic commands
    cmds:
      - echo "Run task --list to see the deterministic command contract"

  test:
    desc: Run deterministic contract and repository-audit regression tests
    cmds:
      - '"{{.PYTHON}}" -I -m unittest discover -s tests -v'
    timeout: 2m

  contracts:
    desc: Run Python-only fixture-backed contract checks
    cmds:
      - '"{{.PYTHON}}" -I automation/local_contracts.py'
    timeout: 3m

  catalog:
    desc: Validate the reusable workflow catalog against the real workflows
    cmds:
      - '"{{.PYTHON}}" -I automation/workflow_catalog.py'
    timeout: 1m

  fleet-plan:
    desc: Plan the explicit repository fleet dispatch without calling GitHub
    cmds:
      - >-
        "{{.PYTHON}}" -I automation/fleet_dispatch.py
        --output "{{.EVIDENCE_DIR}}/fleet"
    timeout: 1m

  roadmap:
    desc: Validate docs/NEXT.md lanes, gates, and review dates
    cmds:
      - '"{{.PYTHON}}" -I automation/roadmap_audit.py'
    timeout: 1m

  roadmap-candidates:
    desc: Derive new local roadmap candidates from repository state
    cmds:
      - '"{{.PYTHON}}" -I automation/roadmap_audit.py --candidates'
    timeout: 1m

  coverage:
    desc: Assert required_files covers automation, schemas, workflows, and standards
    cmds:
      - '"{{.PYTHON}}" -I automation/policy_coverage.py'
    timeout: 1m

  trust-bundles:
    desc: Check policy trust bundles against the current workflow and policy bytes
    cmds:
      - '"{{.PYTHON}}" -I automation/trusted_policy_launcher.py --check'
    timeout: 1m

  workflow-refs:
    desc: Verify reusable-workflow pin pairing and referenced revisions locally
    cmds:
      - '"{{.PYTHON}}" -I automation/workflow_refs.py'
    timeout: 1m

  release-evidence:
    desc: Validate a release evidence document against its schema fields
    cmds:
      - >-
        "{{.PYTHON}}" -I automation/release_evidence.py validate
        --input "{{default "tests/fixtures/release/evidence-dry-run.json" .RELEASE_EVIDENCE}}"
    timeout: 1m

  schema-lint:
    desc: Lint schemas for required/properties drift and broken local references
    cmds:
      - '"{{.PYTHON}}" -I automation/schema_lint.py'
    timeout: 1m

  pin-freshness:
    desc: Compare local reusable-workflow pins with the reviewed catalog hashes
    cmds:
      - '"{{.PYTHON}}" -I automation/pin_freshness.py'
    timeout: 1m

  audit:
    desc: Run repository hygiene and write JSON/Markdown evidence
    cmds:
      - >-
        "{{.PYTHON}}" -I automation/repository_audit.py
        --root .
        --policy .bima/audit.json
        --output "{{.EVIDENCE_DIR}}/audit"
    timeout: 2m

  evidence:
    desc: Normalize repository-audit output into canonical and execution evidence
    cmds:
      - >-
        "{{.PYTHON}}" -I automation/canonical_evidence.py
        --input "{{.EVIDENCE_DIR}}/audit/result.json"
        --output "{{.EVIDENCE_DIR}}/evidence"
    timeout: 1m

  agent-packet:
    desc: Generate a bounded routing packet when canonical evidence is non-pass
    cmds:
      - >-
        "{{.PYTHON}}" -I automation/agent_packet.py
        --input "{{.EVIDENCE_DIR}}/evidence/canonical.json"
        --output "{{.EVIDENCE_DIR}}/agent"
    timeout: 1m

  artifact-manifest:
    desc: Bind declared artifact files to exact size and SHA-256 identities
    requires:
      vars: [ARTIFACT_REQUEST, ARTIFACT_ROOT]
    cmds:
      - >-
        "{{.PYTHON}}" -I automation/artifact_identity.py create
        --request "{{.ARTIFACT_REQUEST}}"
        --root "{{.ARTIFACT_ROOT}}"
        --output "{{.EVIDENCE_DIR}}/artifact-identity"
    timeout: 2m

  artifact-verify:
    desc: Verify current artifact bytes against an existing identity manifest
    requires:
      vars: [ARTIFACT_MANIFEST, ARTIFACT_ROOT]
    cmds:
      - >-
        "{{.PYTHON}}" -I automation/artifact_identity.py verify
        --manifest "{{.ARTIFACT_MANIFEST}}"
        --root "{{.ARTIFACT_ROOT}}"
        --output "{{.EVIDENCE_DIR}}/artifact-identity"
    timeout: 2m

  preflight:
    desc: Run fast, non-mutating repository pre-flight hooks
    cmds:
      - '"{{.PREK}}" --version'
      - action-validator --version
      - pinact version
      - zizmor --version
      - '"{{.PREK}}" validate-config prek.toml'
      - '"{{.PREK}}" run --all-files --show-diff-on-failure --color=never'
    timeout: 2m

  workflow-lint:
    desc: Validate GitHub workflow syntax with actionlint
    cmds:
      - '"{{.ACTIONLINT}}" -version'
      - '"{{.ACTIONLINT}}" -shellcheck= -pyflakes='
    timeout: 2m

  check:
    desc: Run deterministic pre-flight, tests, contracts, audit, and workflow lint
    cmds:
      - task: preflight
      - task: test
      - task: roadmap
      - task: contracts
      - task: coverage
      - task: schema-lint
      - task: catalog
      - task: trust-bundles
      - task: workflow-refs
      - task: release-evidence
      - task: pin-freshness
      - task: fleet-plan
      - task: audit
      - task: evidence
      - task: agent-packet
      - task: workflow-lint
    timeout: 12m

  diff-check:
    desc: Validate unstaged and staged patch whitespace
    cmds:
      - git diff --check
      - git diff --cached --check
    timeout: 1m

  verify:
    desc: Run the complete current verification contract
    cmds:
      - task: check
      - task: diff-check
    timeout: 10m
