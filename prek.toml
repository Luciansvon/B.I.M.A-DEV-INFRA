minimum_prek_version = "0.5.2"

[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "check-case-conflict"

[[repos.hooks]]
id = "check-illegal-windows-names"

[[repos.hooks]]
id = "check-toml"

[[repos.hooks]]
id = "check-yaml"

[[repos.hooks]]
id = "mixed-line-ending"
args = ["--fix=no"]

[[repos.hooks]]
id = "check-merge-conflict"
args = ["--assume-in-merge"]

[[repos.hooks]]
id = "detect-private-key"

[[repos.hooks]]
id = "forbid-new-submodules"

[[repos]]
repo = "local"

[[repos.hooks]]
id = "action-validator"
name = "validate GitHub Actions schemas and path globs"
entry = "action-validator --verbose"
language = "system"
files = "^\\.github/(workflows/[^/]+\\.ya?ml|actions/.+/action\\.ya?ml)$"
verbose = true

[[repos.hooks]]
id = "pinact"
name = "require full-SHA GitHub Action pins"
entry = "pinact run --fix=false --no-api"
language = "system"
files = "^\\.github/(workflows/[^/]+\\.ya?ml|actions/.+/action\\.ya?ml)$"
verbose = true

[[repos.hooks]]
id = "zizmor"
name = "analyze GitHub automation security offline"
entry = "zizmor --offline --strict-collection --no-progress --color=never --render-links=never --show-audit-urls=always"
language = "system"
files = "^\\.github/(workflows/[^/]+\\.ya?ml|actions/.+/action\\.ya?ml|dependabot\\.ya?ml)$"
verbose = true
